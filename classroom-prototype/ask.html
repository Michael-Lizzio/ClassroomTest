<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Question - Chalkboard</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .ask-container {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .controls {
      padding: var(--space-4) var(--space-6);
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--color-neutral-200);
      display: flex;
      gap: var(--space-4);
      align-items: center;
    }

    .ask-content {
      flex: 1;
      display: flex;
      gap: var(--space-8);
      padding: var(--space-8);
      background-color: var(--bg-tertiary);
      overflow: hidden;
      align-items: stretch;
    }

    .student-view {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .phone-frame-large {
      width: 100%;
      max-width: 400px;
      height: 600px;
      background-color: var(--color-neutral-900);
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .phone-frame-large::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 20px;
      background-color: var(--color-neutral-900);
      border-radius: 0 0 20px 20px;
      z-index: 10;
    }

    .phone-screen-large {
      width: 100%;
      height: 100%;
      background-color: #f5f3f0;
      border-radius: 35px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .phone-board-area {
      flex: 1;
      position: relative;
      background-color: #fffef0;
      overflow: hidden;
    }

    .board-with-circle {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .phone-controls-area {
      padding: var(--space-4);
      background-color: white;
      border-top: 1px solid var(--color-neutral-200);
      display: flex;
      gap: var(--space-2);
    }

    .question-input {
      flex: 1;
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius-md);
      padding: var(--space-2);
      font-size: var(--text-sm);
      font-family: var(--font-ui);
    }

    .question-send {
      padding: var(--space-2) var(--space-3);
      background-color: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 600;
      cursor: pointer;
      transition: background-color var(--transition-fast) var(--transition-timing);
    }

    .question-send:hover {
      background-color: var(--color-primary-dark);
    }

    .teacher-view {
      flex: 1;
      background-color: white;
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .inbox-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .question-card {
      background-color: white;
      border: 2px solid var(--color-neutral-200);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      box-shadow: var(--shadow-md);
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .card-thumbnail {
      width: 100%;
      height: 150px;
      background-color: #fffef0;
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-3);
      position: relative;
      overflow: hidden;
    }

    .card-info {
      margin-bottom: var(--space-3);
    }

    .card-name {
      font-weight: 700;
      color: var(--color-neutral-900);
      font-size: var(--text-sm);
      margin-bottom: var(--space-1);
    }

    .card-time {
      font-size: var(--text-xs);
      color: var(--color-neutral-500);
    }

    .card-question {
      font-size: var(--text-sm);
      color: var(--color-neutral-700);
      line-height: var(--line-height-normal);
      margin-bottom: var(--space-3);
      padding: var(--space-3);
      background-color: var(--bg-tertiary);
      border-radius: var(--radius-md);
    }

    .card-status {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-success);
      text-align: center;
      padding: var(--space-2);
      background-color: rgba(16, 185, 129, 0.1);
      border-radius: var(--radius-md);
    }

    .empty-state {
      text-align: center;
      padding: var(--space-8);
      color: var(--color-neutral-500);
    }

    .drawing-canvas {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 1024px) {
      .ask-content {
        flex-direction: column;
      }

      .teacher-view {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">Chalkboard</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="architecture.html">Architecture</a></li>
    </ul>
  </nav>

  <div class="ask-container">
    <div class="controls">
      <button id="play-btn" class="button button-primary button-small">▶ Play</button>
      <button id="pause-btn" class="button button-secondary button-small">⏸ Pause</button>
      <button id="restart-btn" class="button button-secondary button-small">↻ Restart</button>
      <span style="font-size: var(--text-sm); color: var(--color-neutral-600); flex: 1; text-align: right;">Try: click and drag on the board to draw a circle, then click "Send Question"</span>
    </div>

    <div class="ask-content">
      <!-- Student Side -->
      <div class="student-view">
        <div class="phone-frame-large">
          <div class="phone-screen-large">
            <div class="phone-board-area">
              <canvas id="drawing-canvas" class="drawing-canvas"></canvas>
            </div>
            <div class="phone-controls-area">
              <input type="text" class="question-input" id="question-text" placeholder="Ask a question..." value="">
              <button class="question-send" id="send-question-btn">Send</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Teacher Side -->
      <div class="teacher-view">
        <h3 style="margin: 0 0 var(--space-4) 0;">Questions Inbox</h3>
        <div class="inbox-container" id="inbox-container">
          <div class="empty-state">No questions yet</div>
        </div>
      </div>
    </div>
  </div>

  <div class="badge">Prototype · simulated data</div>

  <script src="assets/js/demo-engine.js"></script>
  <script src="assets/js/ask.js"></script>
</body>
</html>
